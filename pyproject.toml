[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archspec"
version = "0.2.0"
description = "Understand what Claude builds: architecture diagram + checker + live view + walkthroughs for Python/ML projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["ruamel.yaml>=0.18"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
archcheck = "archspec.check:main"
archview = "archspec.server:main"

[tool.setuptools.packages.find]
include = ["archspec*"]

[tool.setuptools.package-data]
archspec = ["static/*", "static/vendor/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
